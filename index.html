<!DOCTYPE html>
<html lang="id"><head>
<base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firman Setiap Hari</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#233a2b;background:#f4f6f1;font-size:16px}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:0 auto;padding:20px 16px 90px}.top{padding:22px 16px;background:#225b42;color:white}.top-inner{max-width:780px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:#647568}.top .muted{color:#d9e9df}h1{margin:0;font-size:1.4rem}h2{font-size:1.15rem;margin:0 0 12px}p{line-height:1.65}.card{background:white;border:1px solid #e0e7df;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 3px 14px #1837220a}.small{font-size:.9rem}.pill{display:inline-block;background:#e5f1e7;color:#23623f;padding:7px 11px;border-radius:99px;font-size:.8rem}.btn{display:inline-flex;justify-content:center;align-items:center;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:#276747;color:white;font:inherit}.btn.alt{background:#e6eee7;color:#225b42}.btn:disabled{opacity:.55;cursor:wait}.btn.block{width:100%}.stack{display:grid;gap:10px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}input,textarea{width:100%;border:1px solid #bfcfc3;border-radius:10px;padding:12px;font:inherit;background:white;color:#233a2b}textarea{min-height:120px;resize:vertical}label{display:block;margin:8px 0 6px;font-weight:600}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{font-size:1.7rem;font-weight:800;margin:7px 0}.bar{height:10px;background:#eaf0eb;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#39855b;border-radius:20px}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dee9dd;display:flex;justify-content:center;padding:9px 8px max(10px,env(safe-area-inset-bottom));gap:5px}.nav button{font:inherit;font-size:.88rem;border:0;border-radius:10px;background:transparent;padding:12px 15px;color:#506757}.nav button.active{background:#e5f1e7;color:#205f40;font-weight:700}.hide{display:none!important}.notice{border-radius:12px;padding:12px 15px;background:#fff3dc;color:#684d17;margin-bottom:14px}.success{background:#e6f3e9;color:#245f3a}.error{background:#ffeded;color:#8f2d2d}.section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:#4c7860;font-weight:800}blockquote{border-left:4px solid #9fbea5;margin:12px 0;padding:2px 14px;color:#375442}.login{max-width:430px;margin:50px auto}ul{padding-left:20px}li{padding:6px 0}@media(max-width:450px){main{padding:14px 12px 95px}.card{padding:16px}.nav button{font-size:.77rem;padding:11px 8px}.top{padding:18px 12px}}
</style></head><body>
<header class="top"><div class="top-inner"><div><h1>✝ Firman Setiap Hari</h1><div class="small muted">Bertumbuh bersama dalam firman Tuhan</div></div><button id="logout" class="btn alt hide" type="button">Keluar</button></div></header>
<main>
<section id="login-view" class="login card"><h2>Masuk sebagai jemaat</h2><p class="muted">Gunakan ID jemaat dan PIN 6 angka dari pengurus gereja.</p><form id="login-form"><label for="member-id">ID Jemaat</label><input id="member-id" required maxlength="30" autocomplete="username" placeholder="Contoh: JABC123456"><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="current-password" required placeholder="6 angka"><p><button id="login-btn" class="btn block" type="submit">Masuk</button></p></form><div id="login-message" role="alert"></div></section>
<section id="app-view" class="hide"><div id="status" aria-live="polite"></div><div id="screen"></div></section>
</main>
<nav id="nav" class="nav hide" aria-label="Navigasi utama"><button type="button" data-tab="today" class="active">📖 Hari ini</button><button type="button" data-tab="reflection">💭 Renungan</button><button type="button" data-tab="community">👥 Komunitas</button><button type="button" data-tab="history">✅ Riwayat</button></nav>
<script>
'use strict';
let token=localStorage.getItem('firman_token')||'';
let state=null,activeTab='today',fontSize=Number(localStorage.getItem('firman_fontsize')||16);
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function server(fn,...args){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||String(e))))[fn](...args);});}
function message(text,type='error',target='status'){const el=$(target);el.innerHTML=text?`<div class="notice ${type}">${esc(text)}</div>`:'';}
function busy(id,yes){if($(id))$(id).disabled=yes;}
async function refresh(){try{state=await server('getDashboard',token);$('login-view').classList.add('hide');$('app-view').classList.remove('hide');$('nav').classList.remove('hide');$('logout').classList.remove('hide');message('');render();}catch(e){token='';localStorage.removeItem('firman_token');showLogin();message(e.message,'error','login-message');}}
function showLogin(){$('login-view').classList.remove('hide');$('app-view').classList.add('hide');$('nav').classList.add('hide');$('logout').classList.add('hide');}
function render(){if(!state)return;document.documentElement.style.fontSize=fontSize+'px';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));const r=state.reading;let html='';
if(activeTab==='today')html=`<div class="card"><div class="row between"><div><div class="section-title">Bacaan Hari Ini • ${esc(state.today)}</div><h2>Shalom, ${esc(state.member.name)}!</h2><span class="pill">Hari ke-${state.day} • Rencana 7 hari</span></div><div style="font-size:2rem">📖</div></div><h2 style="margin-top:20px">${esc(r?.reference||'Belum ada bacaan')}</h2><strong>${esc(r?.title||'')}</strong><p>${esc(r?.summary||'')}</p><p class="small muted">Buka Alkitab pribadi Anda untuk membaca teks lengkap bagian ini.</p></div><div class="grid"><div class="card"><div class="small muted">Bacaan saya</div><div class="stat">${state.totalCompleted}</div><div class="small">hari selesai</div></div><div class="card"><div class="small muted">Beruntun</div><div class="stat">${state.streak} 🔥</div><div class="small">hari</div></div></div><div class="card"><h2>Catatan pribadi</h2><label for="note">Apa yang Tuhan ajarkan hari ini?</label><textarea id="note" maxlength="1500" placeholder="Tulis refleksi pribadi...">${esc(state.note)}</textarea><p class="small muted">Catatan hanya dapat dilihat dari akun Anda. Maksimal 1.500 karakter.</p><button id="save" class="btn block">${state.completed?'Perbarui catatan':'Tandai selesai & simpan'}</button><p id="save-message" role="status"></p></div>`;
else if(activeTab==='reflection')html=`<div class="card"><div class="section-title">Renungan hari ini</div><h2>${esc(r?.title||'')}</h2><p><strong>${esc(r?.reference||'')}</strong></p><p>${esc(r?.reflection||'')}</p><div class="section-title">Pertanyaan refleksi</div><blockquote>${esc(r?.question||'')}</blockquote></div><div class="card"><div class="section-title">Doa harian</div><p>${esc(r?.prayer||'')}</p></div><div class="card"><p class="muted small">Renungan dan doa adalah teks ringkas orisinal. Bacalah teks Alkitab dari terjemahan berizin yang Anda gunakan.</p></div>`;
else if(activeTab==='community'){const c=state.community;html=`<div class="card"><div class="section-title">Komunitas hari ini</div><h2>Bertumbuh bersama</h2><div class="stat">${c.completedToday} / ${c.total}</div><p class="muted">jemaat yang menyelesaikan bacaan hari ini</p><div class="bar"><div style="width:${c.total?Math.min(100,100*c.completedToday/c.total):0}%"></div></div><p class="small muted">Ringkasan saja. Nama dan catatan pribadi anggota tidak ditampilkan.</p></div><div class="card"><h2>Progres per kelompok</h2>${c.groups.map(g=>`<div style="margin:18px 0"><div class="row between"><strong>${esc(g.groupName)}</strong><span>${g.completed}/${g.total}</span></div><div class="bar"><div style="width:${g.total?Math.min(100,100*g.completed/g.total):0}%"></div></div></div>`).join('')||'<p>Belum ada anggota.</p>'}</div>`;}
else html=`<div class="card"><div class="row between"><h2>Riwayat bacaan saya</h2><button id="font" class="btn alt" type="button">A⁺ / A⁻</button></div><p class="small muted">Menampilkan hingga 30 catatan bacaan terakhir.</p><div id="history-list">Memuat data...</div></div>`;
$('screen').innerHTML=html;
if(activeTab==='today')$('save').addEventListener('click',save);
if(activeTab==='history'){$('font').addEventListener('click',()=>{fontSize=fontSize>=22?16:fontSize+2;localStorage.setItem('firman_fontsize',fontSize);render();});loadHistory();}
}
async function save(){busy('save',true);try{await server('saveProgress',token,$('note').value);await refresh();message('Bacaan dan catatan berhasil disimpan.','success');}catch(e){message(e.message,'error','save-message');}finally{busy('save',false);}}
async function loadHistory(){try{const list=await server('getMyHistory',token);if(activeTab!=='history')return;$('history-list').innerHTML=list.length?`<ul>${list.map(x=>`<li><strong>${esc(x.date)}</strong> • Hari ${x.day}${x.note?`<p class="small">${esc(x.note)}</p>`:''}</li>`).join('')}</ul>`:'<p>Belum ada bacaan yang dicatat.</p>';}catch(e){message(e.message);}}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();busy('login-btn',true);message('','error','login-message');try{const result=await server('login',$('member-id').value,$('pin').value);token=result.token;localStorage.setItem('firman_token',token);$('pin').value='';await refresh();}catch(err){message(err.message,'error','login-message');}finally{busy('login-btn',false);}});
$('logout').addEventListener('click',async()=>{const old=token;token='';localStorage.removeItem('firman_token');state=null;showLogin();try{await server('logout',old);}catch(e){/* local logout remains */}});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{activeTab=b.dataset.tab;render();}));
if(token)refresh();else showLogin();
</script></body></html>
